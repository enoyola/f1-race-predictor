[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "f1-race-predictor"
version = "1.1.0"
description = "Predict F1 race winners from standings, form, qualifying, circuit history and weather"
readme = "README.md"
authors = [
    { name = "enoyola" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["f1", "formula1", "racing", "prediction", "statistics", "machine-learning"]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
ai = [
    "anthropic>=1.0.0",
]
ui = [
    "pandas>=2.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/enoyola/f1-race-predictor"
Repository = "https://github.com/enoyola/f1-race-predictor"
Issues = "https://github.com/enoyola/f1-race-predictor/issues"

[project.scripts]
f1-predictor = "f1_predictor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["f1_predictor*"]
exclude = ["tests*"]

[tool.black]
line-length = 120
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-q"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
